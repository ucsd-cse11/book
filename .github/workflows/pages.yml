name: Publish the book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push to gh-pages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generation is offline-capable: titles and images are cached in
      # book/data/, so CI never needs to reach Stepik.
      - name: Generate the book
        run: python3 book/generate.py

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
